        note: "This Rikchik calendrical reform explains date format discrepancies in utterances written prior to this one, such as the one from 2004-05-03. A comment explains that previously, the Rikchik year was made of 10 (13(7)) blocks of 49 (100(7)) days each, with the final block of the year being one week shorter."
