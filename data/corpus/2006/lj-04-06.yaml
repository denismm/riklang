date: 2006-04-06
source: "LJ post: https://rikchik.livejournal.com/10607.html"
color: Blue
utterance:
    -
        author: Denis Moskowitz
        literal: "People from Big-appendage-water (Bay) State Institute of Technology have taken Yellow-metal (Golden) State Institute of Technology's big displacer to Big-appendage-water (Bay) State Institute of Technology. People from my school took the big displacer to my school 26(7) years before now."
        loose: "MIT students have brought Caltech's cannon to MIT's campus! Students from my college (Harvey-Mudd) also stole the cannon once, twenty years ago."
        text: Big-N-Quality-0 Tentacle-N-Quality-0 Water-N-Quality-2 Number-N-Agent-0 Ground-N-Includes-2 Machine-N-Quality-0 Learn-N-Agentrec-0 Home-P-Includes-3 Human-R-Agent-1 Home-P-Destination-0P Grass-N-Quality-0 Metal-N-Quality-1 Number-N-Agent-0 Ground-N-Includes-2 Machine-N-Quality-0 Learn-N-Agentrec-0 Home-P-Source-3 Home-P-Includes-0P Big-M-Quality-0 Displacement-T-Patient-2 Give-V-Patient-4 Me-I-Patient-0 Sequence-I-End-2 Me-R-Qualityrec-0 Learn-N-Agentrec-0 Home-P-Includes-2 Human-R-Agent-1 Home-P-Destination-0P Displacement-T-Patient-0P Give-V-Patient-3 Two-I-Source-0 Six-I-Quality-1 Tree-N-Patient-0 Span-I-Quality-2 Me-I-Patient-0 Sequence-I-End-3
        note: "On this day, April 6th, 2006, Caltech's Fleming cannon—a fully-functional antique weapon and campus landmark—appeared on MIT's campus after vanishing from Caltech's nine days prior. Disguised as construction contractors, a group of MIT students acquired it under false pretenses, transported it across the country, and unveiled it just in time for Campus Preview Weekend. It remains one of the most notable hacks (pranks) in MIT's history."
