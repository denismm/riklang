    -
        author: Denis Moskowitz
        literal: "On Water-day, me and the human named Happy-Happy went to Place-of-hills. During that time, we ate many fish, and also watched One-who-takes-by-the-heel Island-bag use a jumping-flea instrument to create music that was big-happy and big-bouncy."
        loose: "On Water-day, Mary and I went to Natick. During that time, we ate lots of fish and watched Jake Shimaburuko play cheerful and lively music on the ukulele."
