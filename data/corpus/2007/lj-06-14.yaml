        note: "In 2003, Massachusetts became the first state to legalize same-sex marriage, and on June 14, 2007, the state legislature defeated a proposed constitutional amendment that threatened to undo the decision. It both reaffirmed the right to marriage equality for gay couples and paved the way for other states to pass their own measures following suit."
