        author: Denis Moskowitz
        literal: Big-fighting is no more. It is caused to be no more when you want it to be no more. The human named Given-by-God and the human named Ocean-Child want you to be happy during Cross-God-Child Day.
        loose: "WAR IS OVER! IF YOU WANT IT / Happy Christmas from John & Yoko"
        text: Big-N-Quality-0 Fight-V-Patient-1 Dead-V-End-1 Dead-V-Sourcerec-0P Span-I-Includes-1 Human-R-Agent-0 Dead-V-Patient-0P Want-V-End-3 God-N-Agent-0 Give-N-Quality-1 Human-R-Patient-1 Big-N-Quality-0 Water-N-Source-1 Child-N-Quality-1 Human-R-Patient-1 Gather-R-Agent-2 Happy-M-Quality-0 Junction-N-Quality-0 God-N-Patient-1 Child-N-Includesrec-1 Span-I-Includes-2 Human-R-Patient-1 Want-V-End-2
        note: This utterance was a submission to the WAR IS OVER! collection run by Yoko Ono and IMAGINEPEACE, in which the English phrase above was translated into a wide variety of languages, including conlangs and ciphers, by many contributors and shared as printable posters. The flickr link currently requires an account to view, but older versions of the page can still be viewed for free via Wayback Machine.
