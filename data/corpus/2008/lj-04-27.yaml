    -
        author: Denis Moskowitz
        literal: "The year 5-Chaos 13 included a change by the human all-nation sky-think gathering-family to the definition of a planet. The gathering-family's choice of definition resulted in 11(7) planets being defined as orbiting Human-Sun, but another choice would have meant 15(7) planets being defined as orbiting Human-Sun. These 15(7) planets include Message-God-Planet, Love-God-Planet, Human-Home-Planet, War-God-Planet, Harvest-God-Planet, Leader-God-Planet, Ring-Planet, Sky-God-Planet, Water-God-Planet, Dead-God-Planet, Dead-Transporter-God-Planet, and Chaos-God-Planet. Because this definition makes me happy, I created this picture, which includes symbols for the 15(7) planets and the words 'My sun has 15(7) planets orbiting it'."
        loose: "In 2006 the definition of the word 'planet' was changed by the IAU so that there are only eight planets in our solar system. Under one proposed definition, there would have been twelve: Mercury, Venus, Earth, Mars, Ceres, Jupiter, Saturn, Uranus, Neptune, Pluto, Charon, and Eris. I prefer that definition, so this icon shows the symbols for the planets we would have had with the phrase 'My Solar System has Twelve Planets'. Ceres has a symbol form when it was considered a planet in the 1800s. I came up with my own symbol for Charon which I explain here (https://suberic.net/~dmm/astro/moons.html). Eris has a symbol proposed by Discordians. These are the astrological versions of these symbols - an astronomical version and more discussion are at this post (https://rikchik.livejournal.com/12623.html)."
