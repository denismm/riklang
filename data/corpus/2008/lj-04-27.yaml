    -
        author: Denis Moskowitz
        literal: "This is a small image of a Rikchik in front of a repulsion vehicle. The image is part of a big image. I made the small image 6 (Rikchik) years before now."
        loose: "This is a picture of a rikchik, standing in front of an airship. It's a small piece of the image on the rikchik intro webpage (http://suberic.net/~dmm/rikchik/intro.html). I created it with the ray-tracing software POV-Ray about eight (human) years ago."
        text: Rikchik-R-Patient-0 Repulsion-R-Patient-0 Front-V-Includesrec-2 Small-M-Quality-0 Art-I-End-2P Art-I-Includesrec-0P Big-M-Quality-0 Art-I-End-2 Small-M-Quality-0O Art-I-Patient-1P Me-R-Agent-0 Fruit-V-Patient-2 Six-I-Quality-0 Tree-N-Instrument-0 Span-I-Quality-2 Me-I-Patient-0 Sequence-I-End-3
        note: "The image in the post is a dead link, but there are still grammatical properties here to observe. For instance, Small-M-Quality-0O has an O-pronomial; used in conjunction with the pronomial collector in the Art morpheme that collects it, it indicates that what's being referred back to is the small-art in the first sentence, not the big-art in the second. In addition, when Front acts as a verb, the order in which morphemes are collected indicates how they are arranged front-to-back."
    -
        author: Denis Moskowitz
        literal: "This image includes 'Big Rikchik-initial human-word-unit' and human-number 145(7). The human-word-unit is the word I am called in the national humans-who-chaos-want-thinking intersecting-family."
        loose: "My pseudonym in the National Puzzlers' League is 'Capital R'. This is because my initials are DMM. If you reverse DMM you get MMD which is 2500 in Roman numerals. Reversing again gives 0052 which is the Unicode codepoint for the character R (in hexadecimal: 82 in decimal). This icon is the piece of the Unicode code charts that defines that character."
